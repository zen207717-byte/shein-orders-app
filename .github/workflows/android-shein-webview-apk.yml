name: Build Android SHEIN WebView APK

on:
  push:
    branches:
      - feature/android-shein-webview
    paths:
      - "android-shein-webview/**"
      - ".github/workflows/android-shein-webview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build debug APK
        working-directory: android-shein-webview
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: um-marwan-shein-test-apk
          path: android-shein-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
